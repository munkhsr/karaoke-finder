name: Weekly song ranking
on:
  schedule:
    - cron: '0 4 * * 1' # Monday 12:00 Asia/Ulaanbaatar
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch previous calendar week
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: node scripts/update-weekly-hits.mjs
      - name: Commit changed ranking
        run: |
          if git diff --quiet -- lib/weekly-hits.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/weekly-hits.json
          git commit -m 'Update weekly hit songs from GA4'
          git push
